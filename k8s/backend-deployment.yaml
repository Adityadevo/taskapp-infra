apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapp-backend
  namespace: taskapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskapp-backend
  template:
    metadata:
      labels:
        app: taskapp-backend
    spec:
      containers:
      - name: backend
        image: pratapad/taskapp-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGODB_URI
          value: "mongodb+srv://fullstackdbuser:Aditya%400007@fullstackcluster.h4kqmjc.mongodb.net/fullstackappdb"
        - name: JWT_SECRET
          value: "secret123"
        - name: PORT
          value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: taskapp-backend-svc
  namespace: taskapp
spec:
  selector:
    app: taskapp-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
